<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1497BE">
<title>Middex Finance — PT Middex Dutaloka Adikarsa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --teal:#1497BE; --teal-d:#0E7393; --teal-l:#E6F5FA;
  --red:#C4041F; --red-l:#FDECEE; --maroon:#5E0010;
  --ink:#14181F; --mute:#5E6875; --line:#E3E8EE; --bg:#F4F6F9; --card:#FFFFFF;
  --ok:#0E8A5F; --ok-l:#E5F6EF; --warn:#B86E00; --warn-l:#FFF4E0;
  --r:12px; --sh:0 1px 2px rgba(16,24,40,.05),0 1px 3px rgba(16,24,40,.08);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
a{color:var(--teal-d)}
button{font-family:inherit}
.num{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.muted{color:var(--mute)} .small{font-size:12px} .b{font-weight:700}
.hide{display:none!important}

/* layout */
.shell{display:flex;min-height:100vh}
.side{width:236px;background:#fff;border-right:1px solid var(--line);position:fixed;inset:0 auto 0 0;display:flex;flex-direction:column;z-index:30;transition:transform .2s}
.side .brand{padding:18px 18px 10px;border-bottom:1px solid var(--line)}
.side .brand img{width:100%;max-width:180px;display:block}
.side .brand .co{font-size:11px;color:var(--mute);margin-top:6px;font-weight:600;letter-spacing:.02em}
.nav{padding:10px 8px;flex:1;overflow:auto}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:9px;color:var(--ink);text-decoration:none;font-weight:600;font-size:13.5px;margin-bottom:2px}
.nav a svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;opacity:.75}
.nav a:hover{background:var(--bg)}
.nav a.on{background:var(--teal-l);color:var(--teal-d)}
.nav a.on svg{opacity:1}
.nav .sec{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--mute);padding:12px 12px 4px;font-weight:700}
.side .foot{padding:12px 14px;border-top:1px solid var(--line);font-size:12px;color:var(--mute)}
.side .foot .mode{display:inline-flex;align-items:center;gap:6px;font-weight:600}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);display:inline-block}
.dot.local{background:var(--warn)}
.main{flex:1;margin-left:236px;min-width:0}
.top{display:none;position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line);padding:10px 14px;align-items:center;gap:12px}
.top img{height:30px}
.burger{border:0;background:var(--bg);border-radius:8px;width:38px;height:38px;display:grid;place-items:center;cursor:pointer}
.content{padding:24px 28px 60px;max-width:1280px}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.ph h1{font-size:22px;margin:0;font-weight:800;letter-spacing:-.01em}
.ph p{margin:4px 0 0;color:var(--mute);font-size:13px}
.scrim{display:none}
@media (max-width:900px){
  .side{transform:translateX(-100%)}
  .side.open{transform:none;box-shadow:0 10px 40px rgba(0,0,0,.2)}
  .scrim.open{display:block;position:fixed;inset:0;background:rgba(10,15,25,.35);z-index:25}
  .main{margin-left:0}
  .top{display:flex}
  .content{padding:16px 14px 70px}
}

/* components */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
.card .hd{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.card .hd h3{margin:0;font-size:14.5px;font-weight:700}
.card .bd{padding:16px}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:700px){.g4,.g3,.g2{grid-template-columns:1fr}}
.kpi{padding:16px}
.kpi .l{font-size:12px;color:var(--mute);font-weight:600}
.kpi .v{font-size:21px;font-weight:800;margin-top:4px;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.kpi .s{font-size:12px;color:var(--mute);margin-top:2px}
.kpi.accent{border-top:3px solid var(--teal)} .kpi.red{border-top:3px solid var(--red)} .kpi.ok{border-top:3px solid var(--ok)} .kpi.warn{border-top:3px solid var(--warn)}

.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;color:var(--ink);padding:8px 13px;border-radius:9px;font-weight:600;font-size:13px;cursor:pointer;white-space:nowrap;text-decoration:none}
.btn:hover{background:var(--bg)}
.btn.pri{background:var(--teal);border-color:var(--teal);color:#fff}
.btn.pri:hover{background:var(--teal-d)}
.btn.red{background:var(--red);border-color:var(--red);color:#fff}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{padding:5px 9px;font-size:12px;border-radius:7px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btns{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btns select{width:auto}

.tbl-wrap{overflow:auto}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--mute);font-weight:700;padding:10px 12px;border-bottom:1px solid var(--line);background:#FAFBFC;white-space:nowrap}
table.t td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
table.t tr.click{cursor:pointer}
table.t tr.click:hover td{background:#F8FBFD}
table.t tfoot td{font-weight:800;background:#FAFBFC}
table.t th.num{text-align:right}
.empty{padding:36px 16px;text-align:center;color:var(--mute)}

.badge{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11.5px;font-weight:700;white-space:nowrap}
.b-lunas{background:var(--ok-l);color:var(--ok)}
.b-sebagian{background:var(--warn-l);color:var(--warn)}
.b-belum{background:#EEF1F5;color:#4A5563}
.b-batal{background:#F1F1F1;color:#888;text-decoration:line-through}
.b-overdue{background:var(--red-l);color:var(--red)}
.b-deposit{background:var(--teal-l);color:var(--teal-d)}
.b-pelunasan{background:var(--ok-l);color:var(--ok)}
.b-refund{background:var(--red-l);color:var(--red)}
.b-lain{background:#F0ECFA;color:#5B3FB0}

.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input,select,textarea{font-family:inherit;font-size:13.5px;border:1px solid #CFD6DE;border-radius:9px;padding:8px 10px;background:#fff;color:var(--ink);width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid rgba(20,151,190,.25);border-color:var(--teal)}
.toolbar input,.toolbar select{width:auto;min-width:140px}
label.f{display:block;font-size:12px;font-weight:700;color:#3A4350;margin-bottom:5px}
.fg{margin-bottom:12px}
.fr{display:grid;gap:12px;grid-template-columns:repeat(2,minmax(0,1fr))}
.fr3{display:grid;gap:12px;grid-template-columns:repeat(3,minmax(0,1fr))}
.fr4{display:grid;gap:12px;grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:700px){.fr,.fr3,.fr4{grid-template-columns:1fr}}
.chk{display:flex;align-items:center;gap:8px;font-weight:600;font-size:13px}
.chk input{width:auto}
.hint{font-size:12px;color:var(--mute);margin-top:4px}

.note{padding:12px 14px;border-radius:10px;background:var(--teal-l);border:1px solid #BFE5F1;font-size:13px}
.note.warn{background:var(--warn-l);border-color:#F3D7A6}
.note.red{background:var(--red-l);border-color:#F4C2C9}
.note ul{margin:6px 0 0;padding-left:18px} .note li{margin:3px 0}

/* modal */
.mwrap{position:fixed;inset:0;background:rgba(10,15,25,.45);display:flex;align-items:flex-start;justify-content:center;padding:4vh 12px;z-index:100;overflow:auto}
.mwrap.l2{z-index:110}
.modal{background:#fff;border-radius:14px;width:100%;max-width:640px;box-shadow:0 20px 60px rgba(0,0,0,.25);display:flex;flex-direction:column;max-height:92vh}
.modal.wide{max-width:980px}
.modal .mh{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px}
.modal .mh h2{font-size:17px;margin:0;font-weight:800}
.modal .mb{padding:18px;overflow:auto}
.modal .mf{padding:12px 18px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.x{border:0;background:var(--bg);width:32px;height:32px;border-radius:8px;cursor:pointer;font-size:18px;line-height:1}

.items td{padding:6px 4px!important;border-bottom:1px dashed var(--line)!important}
.items input{padding:7px 8px}
.totals{margin-left:auto;max-width:360px;width:100%}
.totals div{display:flex;justify-content:space-between;padding:4px 0;font-size:13.5px}
.totals .gt{border-top:2px solid var(--ink);margin-top:6px;padding-top:8px;font-size:16px;font-weight:800}

.kv{display:grid;grid-template-columns:140px 1fr;gap:6px 12px;font-size:13px}
.kv div:nth-child(odd){color:var(--mute)}
.sumrow{display:flex;gap:10px;flex-wrap:wrap}
.sumrow .s{flex:1;min-width:140px;background:var(--bg);border-radius:10px;padding:10px 12px}
.sumrow .s .l{font-size:11.5px;color:var(--mute);font-weight:700}
.sumrow .s .v{font-size:16px;font-weight:800;font-variant-numeric:tabular-nums}

.bars{display:flex;align-items:flex-end;gap:14px;height:170px;padding:8px 4px 0}
.bars .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%}
.bars .pair{flex:1;display:flex;align-items:flex-end;gap:4px;width:100%;justify-content:center}
.bars .bar{width:42%;max-width:26px;border-radius:5px 5px 0 0;min-height:2px}
.bars .in{background:var(--teal)} .bars .out{background:var(--red)}
.bars .lb{font-size:11px;color:var(--mute);font-weight:600}
.legend{display:flex;gap:14px;font-size:12px;color:var(--mute)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.prog{height:10px;background:#EEF1F5;border-radius:99px;overflow:hidden}
.prog > i{display:block;height:100%;background:var(--teal);border-radius:99px}

.toast-box{position:fixed;bottom:18px;right:18px;z-index:200;display:flex;flex-direction:column;gap:8px}
.toast{background:var(--ink);color:#fff;padding:10px 14px;border-radius:10px;font-weight:600;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.2);max-width:360px}
.toast.err{background:var(--red)}

/* auth/setup */
.auth{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(160deg,#EAF6FA 0%,#F7F8FA 50%,#FBEFF1 100%)}
.auth .box{background:#fff;border-radius:16px;box-shadow:0 20px 60px rgba(20,40,60,.12);padding:28px;width:100%;max-width:440px}
.auth .box.wide{max-width:640px}
.auth img{max-width:220px;display:block;margin:0 auto 6px}
.auth h2{text-align:center;margin:6px 0 2px;font-size:18px}
.auth p.c{text-align:center;color:var(--mute);margin:0 0 18px;font-size:13px}
pre.code{background:#0F1720;color:#D6E2EE;padding:12px 14px;border-radius:10px;font-size:12px;overflow:auto;white-space:pre}

/* print */
#print{display:none}
@media print{
  @page{size:A4;margin:12mm}
  body{background:#fff}
  body > *:not(#print){display:none!important}
  #print{display:block}
}
.doc{font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:#111;font-size:11.5px;line-height:1.45;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.doc .dh{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;padding-bottom:12px;border-bottom:3px solid var(--teal);position:relative}
.doc .dh:after{content:"";position:absolute;left:0;bottom:-6px;width:38%;height:3px;background:var(--red)}
.doc .dh img{height:58px}
.doc .dh .co{text-align:right;font-size:10.5px;color:#444}
.doc .dh .co b{font-size:13px;color:#111;display:block;margin-bottom:2px}
.doc .ttl{display:flex;justify-content:space-between;align-items:flex-end;margin:22px 0 14px}
.doc .ttl h1{margin:0;font-size:26px;letter-spacing:.06em;color:var(--teal-d);font-weight:800}
.doc .ttl .no{text-align:right;font-size:11px}
.doc .ttl .no b{font-size:13px}
.doc .two{display:grid;grid-template-columns:1.2fr 1fr;gap:18px;margin-bottom:14px}
.doc .lbl{font-size:9.5px;text-transform:uppercase;letter-spacing:.08em;color:#777;font-weight:700;margin-bottom:3px}
.doc .box{border:1px solid #DDE3EA;border-radius:8px;padding:10px 12px}
.doc table.it{width:100%;border-collapse:collapse;margin-top:6px}
.doc table.it th{background:var(--teal);color:#fff;font-size:10px;text-transform:uppercase;letter-spacing:.05em;padding:7px 8px;text-align:left}
.doc table.it th.num{text-align:right}
.doc table.it td{padding:7px 8px;border-bottom:1px solid #E5E9EE;vertical-align:top}
.doc table.it tr:nth-child(even) td{background:#F8FAFC}
.doc .tot{margin-left:auto;width:360px;margin-top:10px}
.doc .tot div span:first-child{padding-right:10px}
.doc .tot div{display:flex;justify-content:space-between;padding:3px 0}
.doc .tot .gt{border-top:2px solid #111;margin-top:4px;padding-top:6px;font-size:14px;font-weight:800}
.doc .tot .due{background:var(--red);color:#fff;padding:6px 8px;border-radius:6px;font-weight:800;margin-top:6px}
.doc .terb{font-style:italic;margin:10px 0;padding:8px 10px;background:#F6F8FA;border-left:3px solid var(--teal);font-size:11px}
.doc .bank{border:1.5px solid var(--teal);border-radius:8px;padding:10px 12px;background:#F2FAFD}
.doc .bank .row{display:grid;grid-template-columns:120px 1fr;gap:2px 10px}
.doc .sign{display:flex;justify-content:flex-end;margin-top:26px}
.doc .sign div{text-align:center;width:220px}
.doc .sign .sp{height:66px}
.doc .foot{margin-top:24px;padding-top:8px;border-top:1px solid #E5E9EE;font-size:9.5px;color:#888;text-align:center}
.doc .stamp{display:inline-block;border:2px solid;padding:3px 10px;border-radius:6px;font-weight:800;letter-spacing:.1em;font-size:12px;transform:rotate(-4deg)}
.doc .rcpt-amt{font-size:22px;font-weight:800;border:2px solid #111;display:inline-block;padding:6px 14px;border-radius:8px;margin-top:6px}
.doc .rline{display:grid;grid-template-columns:170px 1fr;gap:10px;padding:8px 0;border-bottom:1px dotted #BBB;font-size:12.5px}
.doc table.rep{width:100%;border-collapse:collapse;font-size:10.5px}
.doc table.rep th,.doc table.rep td{border:1px solid #DDE3EA;padding:5px 6px}
.doc table.rep th{background:#F0F4F7;text-align:left}
</style>
</head>

<div id="app"></div>
<div id="modals"></div>
<div class="toast-box" id="toasts"></div>
<div id="print"></div>

/* ---------- utils ---------- */
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = v => { const n = parseFloat(String(v ?? '').toString().replace(',', '.')); return isFinite(n) ? n : 0; };
const rpn = n => Math.round(num(n)).toLocaleString('id-ID');
const rp = n => (num(n) < 0 ? '-Rp ' : 'Rp ') + Math.abs(Math.round(num(n))).toLocaleString('id-ID');
const pr = n => num(n).toLocaleString('id-ID', {maximumFractionDigits:2});
const pct = n => (isFinite(n) ? n : 0).toLocaleString('id-ID', {maximumFractionDigits:1}) + '%';
const today = () => { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0,10); };
const ym = d => (d || '').slice(0,7);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,9);
const BULAN = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
const fdate = d => { if (!d) return '-'; const [y,m,dd] = d.split('-'); return `${+dd} ${BULAN[+m-1]?.slice(0,3)} ${y}`; };
const fdateL = d => { if (!d) return '-'; const [y,m,dd] = d.split('-'); return `${+dd} ${BULAN[+m-1]} ${y}`; };
const fmonth = m => { if (!m) return 'Semua periode'; const [y,mm] = m.split('-'); return `${BULAN[+mm-1]} ${y}`; };
const addDays = (d, n) => { const x = new Date(d + 'T00:00:00'); x.setDate(x.getDate() + n); return x.toISOString().slice(0,10); };
const endOfMonth = m => { const [y, mm] = m.split('-').map(Number); const d = new Date(Date.UTC(y, mm, 0)); return d.toISOString().slice(0,10); };
const sum = (arr, f) => arr.reduce((s, x) => s + num(f(x)), 0);
const clean = o => JSON.parse(JSON.stringify(o));

/* format uang sesuai mata uang & bahasa */
function money(n, cur = 'IDR', lang = 'id'){
  n = num(n); const neg = n < 0; n = Math.abs(n);
  const loc = lang === 'en' ? 'en-US' : 'id-ID';
  const s = cur === 'USD' ? 'US$ ' + n.toLocaleString(loc, {minimumFractionDigits:2, maximumFractionDigits:2}) : 'Rp ' + Math.round(n).toLocaleString(loc);
  return (neg ? '-' : '') + s;
}
const mnum = (n, cur = 'IDR', lang = 'id') => cur === 'USD' ? num(n).toLocaleString(lang === 'en' ? 'en-US' : 'id-ID', {minimumFractionDigits:2, maximumFractionDigits:2}) : Math.round(num(n)).toLocaleString(lang === 'en' ? 'en-US' : 'id-ID');
function wordsEn(n){
  n = Math.floor(Math.abs(num(n)));
  const a = ['','one','two','three','four','five','six','seven','eight','nine','ten','eleven','twelve','thirteen','fourteen','fifteen','sixteen','seventeen','eighteen','nineteen'];
  const t = ['','','twenty','thirty','forty','fifty','sixty','seventy','eighty','ninety'];
  const f = x => {
    if (x < 20) return a[x];
    if (x < 100) return t[Math.floor(x/10)] + (x % 10 ? '-' + a[x % 10] : '');
    if (x < 1000) return a[Math.floor(x/100)] + ' hundred' + (x % 100 ? ' ' + f(x % 100) : '');
    for (const [val, w] of [[1e12,'trillion'],[1e9,'billion'],[1e6,'million'],[1e3,'thousand']]) if (x >= val) return f(Math.floor(x/val)) + ' ' + w + (x % val ? ' ' + f(x % val) : '');
  };
  return f(n) || 'zero';
}
const tcase = s => s.replace(/\s+/g,' ').trim().replace(/(^|[\s-])\w/g, c => c.toUpperCase());
function amountWords(n, cur = 'IDR', lang = 'id'){
  n = Math.abs(num(n));
  if (cur === 'USD'){
    const d = Math.floor(n + 1e-9), c = Math.round((n - d) * 100);
    return lang === 'en'
      ? tcase(wordsEn(d) + ' US Dollars' + (c ? ' and ' + wordsEn(c) + ' cents' : ''))
      : tcase(terbilangRaw(d) + ' dolar Amerika Serikat' + (c ? ' ' + terbilangRaw(c) + ' sen' : ''));
  }
  return lang === 'en' ? tcase(wordsEn(n) + ' Rupiah') : terbilang(n);
}
function terbilang(n){ return tcase(terbilangRaw(n) + ' rupiah'); }
function terbilangRaw(n){
  n = Math.floor(Math.abs(num(n)));
  const s = ['','satu','dua','tiga','empat','lima','enam','tujuh','delapan','sembilan','sepuluh','sebelas'];
  const f = x => {
    if (x < 12) return s[x];
    if (x < 20) return f(x-10) + ' belas';
    if (x < 100) return f(Math.floor(x/10)) + ' puluh ' + f(x%10);
    if (x < 200) return 'seratus ' + f(x-100);
    if (x < 1000) return f(Math.floor(x/100)) + ' ratus ' + f(x%100);
    if (x < 2000) return 'seribu ' + f(x-1000);
    if (x < 1e6) return f(Math.floor(x/1000)) + ' ribu ' + f(x%1000);
    if (x < 1e9) return f(Math.floor(x/1e6)) + ' juta ' + f(x%1e6);
    if (x < 1e12) return f(Math.floor(x/1e9)) + ' miliar ' + f(x%1e9);
    return f(Math.floor(x/1e12)) + ' triliun ' + f(x%1e12);
  };
  return f(n).replace(/\s+/g,' ').trim() || 'nol';
}

function toast(msg, type){
  const el = document.createElement('div');
  el.className = 'toast' + (type === 'err' ? ' err' : '');
  el.textContent = msg;
  $('#toasts').appendChild(el);
  setTimeout(() => el.remove(), type === 'err' ? 6000 : 2800);
}

function getFbConfig(){
  if (FIREBASE_CONFIG) return FIREBASE_CONFIG;
  try { return JSON.parse(localStorage.getItem('mdx_fbconfig') || 'null'); } catch { return null; }
}
function parseConfig(txt){
  const m = txt.match(/\{[\s\S]*\}/);
  if (!m) throw new Error('Objek konfigurasi { ... } tidak ditemukan');
  const j = m[0]
    .replace(/\/\/.*$/gm, '')
    .replace(/([{,]\s*)([A-Za-z_]\w*)\s*:/g, '$1"$2":')
    .replace(/'/g, '"')
    .replace(/,\s*}/g, '}');
  const o = JSON.parse(j);
  if (!o.apiKey || !o.projectId) throw new Error('apiKey / projectId tidak ada');
  return o;
}

  async del(c, id){ S[c] = S[c].filter(x => x.id !== id); this.persist(c); scheduleRender(); },
  async putMany(c, arr){ const map = new Map(S[c].map(x => [x.id, x])); arr.forEach(o => map.set(o.id, clean(o))); S[c] = [...map.values()]; this.persist(c); scheduleRender(); },

async function loadFirebase(cfg){
  const base = `https://www.gstatic.com/firebasejs/${FB_VER}/`;
  const [appM, authM, fsM] = await Promise.all([
    import(base + 'firebase-app.js'), import(base + 'firebase-auth.js'), import(base + 'firebase-firestore.js')
  ]);
  const app = appM.initializeApp(cfg);
  let db;
  try { db = fsM.initializeFirestore(app, { localCache: fsM.persistentLocalCache({ tabManager: fsM.persistentMultipleTabManager() }) }); }
  catch (e) { db = fsM.getFirestore(app); }
  const auth = authM.getAuth(app);
  fb = { appM, authM, fsM, app, db, auth };
  DB = {
    mode: 'firebase',
    put: (c, o) => fsM.setDoc(fsM.doc(db, c, o.id), clean(o)),
    del: (c, id) => fsM.deleteDoc(fsM.doc(db, c, id)),
    saveSettings: o => fsM.setDoc(fsM.doc(db, 'settings', 'main'), clean(o)),
    putMany: async (c, arr) => { for (let i = 0; i < arr.length; i += 400){ const b = fsM.writeBatch(db); arr.slice(i, i + 400).forEach(o => b.set(fsM.doc(db, c, o.id), clean(o))); await b.commit(); } },
    delMany: async (c, ids) => { for (let i = 0; i < ids.length; i += 400){ const b = fsM.writeBatch(db); ids.slice(i, i + 400).forEach(id => b.delete(fsM.doc(db, c, id))); await b.commit(); } },
  };
}
function subscribeFirebase(){
  const { fsM, db } = fb;
  unsubs.forEach(u => u()); unsubs = [];
  COLS.forEach(c => {
    unsubs.push(fsM.onSnapshot(fsM.collection(db, c),
      snap => { S[c] = snap.docs.map(d => ({ ...d.data(), id: d.id })); scheduleRender(); },
      err => toast(`Gagal memuat ${c}: ${err.message}`, 'err')));
  });
  unsubs.push(fsM.onSnapshot(fsM.doc(db, 'settings', 'main'),
    d => { S.settings = { ...DEFAULT_SETTINGS, ...(d.exists() ? d.data() : {}) }; scheduleRender(); },
    err => toast('Gagal memuat pengaturan: ' + err.message, 'err')));
}

/* ---------- business logic ---------- */
function invCalc(inv){
  const sub = sum(inv.items || [], it => num(it.qty) * num(it.harga));
  const dpp = Math.max(0, sub - num(inv.diskon));
  const ppn = inv.ppnOn ? Math.round(dpp * num(inv.ppnRate) / 100) : 0;
  return { sub, dpp, ppn, total: dpp + ppn };
}
/* nilai rupiah riil sebuah pembayaran (untuk kas & pajak) */
const payIdr = p => p.idr != null && p.idr !== '' ? num(p.idr) : num(p.jumlah);
/* nilai yang mengurangi tagihan (dalam mata uang invoice) */
const payApplied = (p, cur) => num(p.jumlah) + (cur === 'IDR' ? num(p.pph) : 0);
const curOf = inv => inv && inv.currency === 'USD' ? 'USD' : 'IDR';
const activeInv = () => S.invoices.filter(i => !i.arsip);
function invInfo(inv){
  const c = invCalc(inv);
  const cur = curOf(inv), kurs = cur === 'IDR' ? 1 : num(inv.kurs);
  const pays = S.payments.filter(p => p.invoiceId === inv.id).sort((a,b) => (a.tgl||'').localeCompare(b.tgl||''));
  const received = sum(pays.filter(p => p.tipe !== 'refund'), p => payApplied(p, cur));
  const refunded = sum(pays.filter(p => p.tipe === 'refund'), p => p.jumlah);
  const net = received - refunded;
  const netIdr = sum(pays.filter(p => p.tipe !== 'refund'), p => payIdr(p) + num(p.pph)) - sum(pays.filter(p => p.tipe === 'refund'), payIdr);
  const batal = inv.status === 'batal';
  const eps = cur === 'USD' ? 0.005 : 0.5;
  const sisa = batal ? 0 : Math.max(0, c.total - net);
  const lebih = batal ? Math.max(0, net) : Math.max(0, net - c.total);
  let st = 'belum';
  if (batal) st = 'batal'; else if (c.total > 0 && net >= c.total - eps) st = 'lunas'; else if (net > 0) st = 'sebagian';
  const overdue = !inv.arsip && !batal && st !== 'lunas' && inv.jatuhTempo && inv.jatuhTempo < today();
  const exps = S.expenses.filter(e => e.invoiceId === inv.id);
  const cost = sum(exps, e => e.jumlah);
  const ratio = c.total ? c.dpp / c.total : 1;
  const revenue = batal ? Math.max(0, netIdr) * ratio : c.dpp * kurs;   // selalu IDR
  const gp = revenue - cost;
  const sisaX = st === 'lunas' || inv.arsip ? 0 : sisa;
  return { ...c, cur, kurs, arsip: !!inv.arsip, odooStatus: inv.odooStatus, pays, exps, received, refunded, net, netIdr, sisa: sisaX, sisaIdr: sisaX * kurs, totalIdr: c.total * kurs, lebih, st, overdue, cost, revenue, gp, margin: revenue ? gp / revenue * 100 : 0, ratio };
}

const akunName = id => (akunList().find(a => a.id === id) || akunList()[0] || {}).nama || '-';
const akunDef = () => (akunList()[0] || {}).id || 'mandiri';
const akunOf = x => x.akun || akunDef();
function akunMoves(id){
  const M = [];
  S.payments.filter(p => akunOf(p) === id).forEach(p => { const iv = invById(p.invoiceId); M.push({ tgl: p.tgl, jenis: p.tipe, ref: p.no, ket: `${iv?.no || ''} · ${custName(p.customerId)}`, jml: p.tipe === 'refund' ? -payIdr(p) : payIdr(p) }); });
  S.incomes.filter(x => akunOf(x) === id).forEach(x => M.push({ tgl: x.tgl, jenis: 'lain', ref: x.kategori, ket: x.keterangan, jml: num(x.jumlah) }));
  S.expenses.filter(e => akunOf(e) === id).forEach(e => M.push({ tgl: e.tgl, jenis: 'biaya', ref: e.kategori, ket: [e.vendor, e.keterangan].filter(Boolean).join(' · '), jml: -num(e.jumlah) }));
  S.taxpays.filter(t => akunOf(t) === id).forEach(t => M.push({ tgl: t.tglSetor, jenis: 'pajak', ref: t.jenis, ket: `Masa ${fmonth(t.masa)} ${t.ntpn ? '· NTPN ' + t.ntpn : ''}`, jml: -num(t.jumlah) }));
  S.transfers.forEach(t => {
    if (t.dari === id) M.push({ tgl: t.tgl, jenis: 'mutasi', ref: 'Mutasi keluar', ket: `ke ${akunName(t.ke)}${t.ket ? ' · ' + t.ket : ''}`, jml: -num(t.jumlah), tid: t.id });
    if (t.ke === id) M.push({ tgl: t.tgl, jenis: 'mutasi', ref: 'Mutasi masuk', ket: `dari ${akunName(t.dari)}${t.ket ? ' · ' + t.ket : ''}`, jml: num(t.jumlah), tid: t.id });
  });
  return M.sort((a,b) => (a.tgl||'').localeCompare(b.tgl||''));
}

function nextNo(kind, date){
  const [y, m] = (date || today()).split('-');
  const pre = `${kind}/${S.settings.prefix || 'MDA'}/${y}/${m}/`;
  const pool = kind === 'INV' ? S.invoices.map(i => i.no) : S.payments.map(p => p.no);
  let max = 0;
  pool.forEach(n => { if (n && n.startsWith(pre)) { const k = parseInt(n.slice(pre.length)); if (k > max) max = k; } });
  return pre + String(max + 1).padStart(3, '0');
}

/* pajak: rekap per bulan */
function taxRecap(year){
  const st = S.settings, rate = num(st.pphRate) / 100;
  const R = Array.from({length:12}, (_, i) => ({ m: i, omzetInv: 0, omzetLain: 0, omzet: 0, wht: 0, pph: 0, setor: 0, dibayar: 0, ppnDpp: 0, ppn: 0, ppnDibayar: 0 }));
  const mi = d => +d.slice(5,7) - 1;
  if (st.basis === 'kas'){
    S.payments.forEach(p => {
      if (!p.tgl?.startsWith(year)) return;
      const inv = invById(p.invoiceId); const c = inv ? invCalc(inv) : null;
      const ratio = c && c.total ? c.dpp / c.total : 1;
      if (inv && inv.arsip) return;
      const amt = p.tipe === 'refund' ? -payIdr(p) : payIdr(p) + num(p.pph);
      R[mi(p.tgl)].omzetInv += amt * ratio;
    });
  } else {
    activeInv().forEach(inv => {
      if (!inv.tgl?.startsWith(year)) return;
      R[mi(inv.tgl)].omzetInv += invInfo(inv).revenue;
    });
  }
  activeInv().forEach(inv => {
    if (!inv.tgl?.startsWith(year) || inv.status === 'batal' || !inv.ppnOn) return;
    const c = invCalc(inv), k = curOf(inv) === 'USD' ? num(inv.kurs) : 1; R[mi(inv.tgl)].ppnDpp += c.dpp * k; R[mi(inv.tgl)].ppn += Math.round(c.ppn * k);
  });
  S.incomes.forEach(x => { if (x.tgl?.startsWith(year) && x.omzet) R[mi(x.tgl)].omzetLain += num(x.jumlah); });
  S.payments.forEach(p => { if (p.tgl?.startsWith(year) && p.tipe !== 'refund') R[mi(p.tgl)].wht += num(p.pph); });
  S.taxpays.forEach(t => {
    if (!t.masa?.startsWith(year)) return;
    const k = +t.masa.slice(5,7) - 1;
    if (t.jenis === 'PPN') R[k].ppnDibayar += num(t.jumlah); else if ((t.jenis || '').startsWith('PPh Final')) R[k].dibayar += num(t.jumlah);
  });
  let cum = 0;
  R.forEach(r => {
    r.omzet = Math.max(0, r.omzetInv + r.omzetLain);
    r.pph = Math.floor(r.omzet * rate);
    r.setor = Math.max(0, r.pph - r.wht);
    cum += r.omzet; r.cum = cum;
    const [y] = [year]; const nm = r.m === 11 ? `${+y+1}-01` : `${y}-${String(r.m+2).padStart(2,'0')}`;
    r.due = nm + '-15';
  });
  return R;
}
/* laba rugi per bulan (basis sama dengan setelan pajak untuk pendapatan) */
function plRecap(year){
  const tx = taxRecap(year);
  return tx.map((t, i) => {
    const m = `${year}-${String(i+1).padStart(2,'0')}`;
    const hpp = sum(S.expenses.filter(e => ym(e.tgl) === m && e.invoiceId), e => e.jumlah);
    const ops = sum(S.expenses.filter(e => ym(e.tgl) === m && !e.invoiceId), e => e.jumlah);
    const lain = sum(S.incomes.filter(x => ym(x.tgl) === m), x => x.jumlah);
    const pend = t.omzetInv;
    const gp = pend - hpp;
    const ebt = gp + lain - ops;
    return { m, pend, hpp, gp, lain, ops, ebt, pph: t.pph, net: ebt - t.pph };
  });
}
function cashIn(m){ return sum(S.payments.filter(p => ym(p.tgl) === m), p => p.tipe === 'refund' ? -payIdr(p) : payIdr(p)) + sum(S.incomes.filter(x => ym(x.tgl) === m), x => x.jumlah); }
function cashOut(m){ return sum(S.expenses.filter(e => ym(e.tgl) === m), e => e.jumlah) + sum(S.taxpays.filter(t => ym(t.tglSetor) === m), t => t.jumlah); }

  ['sec','Utama'], ['dashboard','Dashboard'], ['invoices','Invoice & Pembayaran'], ['customers','Data Customer'],
  ['sec','Kas'], ['income','Pemasukan'], ['expenses','Pengeluaran'], ['cash','Kas & Bank'],

];

/* ---------- render ---------- */
let rq = false;
function scheduleRender(){ if (rq) return; rq = true; requestAnimationFrame(() => { rq = false; render(); }); }

function render(){
  if (!DB) return;
  if (DB.mode === 'firebase' && !user) return;
  const app = $('#app');
  const ae = document.activeElement, fid = ae && ae.id && app.contains(ae) ? ae.id : null;
  let pos = null; try { pos = ae.selectionStart; } catch {}
  if (!$('#shell')){
    app.innerHTML = `
    <div class="shell" id="shell">
      <aside class="side" id="side">
        <div class="brand"><img src="${LOGO}" alt="Middex"><div class="co" id="coName"></div></div>
        <nav class="nav" id="nav"></nav>
        <div class="foot" id="sideFoot"></div>
      </aside>
      <div class="scrim" id="scrim" onclick="A.menu(false)"></div>
      <div class="main">
        <div class="top"><button class="burger" onclick="A.menu(true)" aria-label="Menu"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg></button><img src="${LOGO}" alt=""></div>
        <div class="content" id="view"></div>
      </div>
    </div>`;
  }
  $('#coName').textContent = S.settings.nama;
  $('#nav').innerHTML = NAV.map(([k, l]) => k === 'sec' ? `<div class="sec">${l}</div>` :
    `<a href="#${k}" class="${UI.route === k ? 'on' : ''}" onclick="A.menu(false)"><svg viewBox="0 0 24 24">${I[k]}</svg>${l}</a>`).join('');
  $('#sideFoot').innerHTML = DB.mode === 'firebase'
    ? `<div class="mode"><span class="dot"></span>Firebase · tersinkron</div><div style="margin-top:4px;overflow:hidden;text-overflow:ellipsis">${esc(user?.email || '')}</div><button class="btn sm" style="margin-top:8px" onclick="A.logout()">Keluar</button>`
    : `<div class="mode"><span class="dot local"></span>Mode lokal (uji coba)</div><div style="margin-top:4px">Data hanya di browser ini. Hubungkan Firebase di Pengaturan.</div>`;
  const V = { cash: vCash, dashboard: vDashboard, invoices: vInvoices, customers: vCustomers, income: vIncome, expenses: vExpenses, analytics: vAnalytics, reports: vReports, tax: vTax, settings: vSettings }[UI.route] || vDashboard;
  $('#view').innerHTML = V();
  if (fid){ const el = document.getElementById(fid); if (el){ el.focus(); try { if (pos != null) el.setSelectionRange(pos, pos); } catch {} } }
}

const pageHead = (t, sub, actions = '') => `<div class="ph"><div><h1>${t}</h1>${sub ? `<p>${sub}</p>` : ''}</div><div class="btns">${actions}</div></div>`;
const yearsAvail = () => {
  const ys = new Set([today().slice(0,4)]);
  [...activeInv(), ...S.payments, ...S.expenses, ...S.incomes].forEach(x => x.tgl && ys.add(x.tgl.slice(0,4)));
  return [...ys].sort().reverse();
};

/* ---- Dashboard ---- */
function vDashboard(){
  const m = ym(today());
  const infos = activeInv().map(i => ({ i, x: invInfo(i) }));
  const omzetM = sum(infos.filter(o => ym(o.i.tgl) === m), o => o.x.revenue);
  const piutang = sum(infos, o => o.x.sisaIdr);
  const pribadi = akunList().filter(a => a.jenis === 'pribadi').map(a => ({ a, s: akunSaldo(a.id) })).filter(z => Math.abs(z.s) >= 1);
  const inM = cashIn(m), outM = cashOut(m);
  const months = []; for (let k = 5; k >= 0; k--){ const d = new Date(); d.setDate(1); d.setMonth(d.getMonth() - k); months.push(`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`); }
  const data = months.map(mm => ({ mm, a: cashIn(mm), b: cashOut(mm) }));
  const mx = Math.max(1, ...data.map(d => Math.max(d.a, d.b)));
  const overdue = infos.filter(o => o.x.sisa > 0).sort((a,b) => (a.i.jatuhTempo||'').localeCompare(b.i.jatuhTempo||'')).slice(0, 8);
  const lim = addDays(today(), 45);
  const dep = infos.filter(o => o.i.status !== 'batal' && o.i.tglBerangkat && o.i.tglBerangkat >= today() && o.i.tglBerangkat <= lim).sort((a,b) => a.i.tglBerangkat.localeCompare(b.i.tglBerangkat));
  const y = today().slice(0,4), tr = taxRecap(y);
  const prevIdx = new Date().getMonth() - 1;
  const prev = prevIdx >= 0 ? tr[prevIdx] : null;
  const ytd = tr[new Date().getMonth()].cum;
  return pageHead('Dashboard', `${fmonth(m)} · ${esc(S.settings.nama)}`, `<button class="btn pri" onclick="A.invForm()">+ Invoice baru</button><button class="btn" onclick="A.expForm()">+ Pengeluaran</button>`) + `
  <div class="grid g4">
    <div class="card kpi accent"><div class="l">Omzet bulan ini (DPP)</div><div class="v">${rp(omzetM)}</div><div class="s">${activeInv().filter(i => ym(i.tgl) === m && i.status !== 'batal').length} invoice terbit</div></div>
    <div class="card kpi ok"><div class="l">Kas masuk bulan ini</div><div class="v">${rp(inM)}</div><div class="s">Deposit + pelunasan − refund + lain-lain</div></div>
    <div class="card kpi red"><div class="l">Kas keluar bulan ini</div><div class="v">${rp(outM)}</div><div class="s">Biaya trip, operasional & setoran pajak</div></div>
    <div class="card kpi warn"><div class="l">Total piutang</div><div class="v">${rp(piutang)}</div><div class="s">${infos.filter(o => o.x.overdue).length} invoice lewat jatuh tempo · ekuivalen IDR</div></div>
  </div>
  ${pribadi.map(z => `<div class="note warn" style="margin-top:14px"><b>${rp(z.s)}</b> dana perusahaan masih berada di <b>${esc(z.a.nama)}</b>. Setorkan ke rekening PT lalu catat lewat <a href="#cash">Kas &amp; Bank → Mutasi</a>.</div>`).join('')}
  <div class="grid g2" style="margin-top:14px">
    <div class="card"><div class="hd"><h3>Arus kas 6 bulan</h3><div class="legend"><span><i style="background:var(--teal)"></i>Masuk</span><span><i style="background:var(--red)"></i>Keluar</span></div></div>
      <div class="bd"><div class="bars">${data.map(d => `<div class="col"><div class="pair"><div class="bar in" style="height:${d.a/mx*100}%" title="Masuk ${rp(d.a)}"></div><div class="bar out" style="height:${d.b/mx*100}%" title="Keluar ${rp(d.b)}"></div></div><div class="lb">${BULAN[+d.mm.slice(5)-1].slice(0,3)}</div></div>`).join('')}</div></div>
    </div>
    <div class="card"><div class="hd"><h3>Pajak — PPh Final ${pr(S.settings.pphRate)}%</h3><a href="#tax" class="btn sm">Buka laporan</a></div>
      <div class="bd">
        ${prev ? `<div class="sumrow"><div class="s"><div class="l">Masa ${BULAN[prevIdx]} — perlu disetor</div><div class="v">${rp(Math.max(0, prev.setor - prev.dibayar))}</div><div class="small muted">Batas setor ${fdate(prev.due)}</div></div><div class="s"><div class="l">Omzet ${BULAN[prevIdx]}</div><div class="v">${rp(prev.omzet)}</div></div></div>` : '<div class="muted">Masa pajak pertama tahun ini.</div>'}
        <div style="margin-top:14px" class="small b">Omzet ${y} s.d. bulan ini: ${rp(ytd)} dari batas ${rp(S.settings.batasOmzet)}</div>
        <div class="prog" style="margin-top:6px"><i style="width:${Math.min(100, ytd / num(S.settings.batasOmzet) * 100)}%;${ytd > num(S.settings.batasOmzet) ? 'background:var(--red)' : ''}"></i></div>
      </div>
    </div>
  </div>
  <div class="grid g2" style="margin-top:14px">
    <div class="card"><div class="hd"><h3>Tagihan belum lunas</h3><a href="#invoices" class="btn sm">Semua invoice</a></div>
      ${overdue.length ? `<div class="tbl-wrap"><table class="t"><thead><tr><th>Invoice</th><th>Jatuh tempo</th><th class="num">Sisa</th></tr></thead><tbody>${overdue.map(o => `<tr class="click" onclick="A.openInv('${o.i.id}')"><td><b>${esc(o.i.no)}</b><div class="small muted">${esc(o.i.customerNama)}</div></td><td>${fdate(o.i.jatuhTempo)}<div>${statusBadge(o.x)}</div></td><td class="num b">${money(o.x.sisa, o.x.cur)}</td></tr>`).join('')}</tbody></table></div>` : '<div class="empty">Semua tagihan lunas.</div>'}
    </div>
    <div class="card"><div class="hd"><h3>Keberangkatan 45 hari ke depan</h3></div>
      ${dep.length ? `<div class="tbl-wrap"><table class="t"><thead><tr><th>Berangkat</th><th>Program</th><th class="num">Laba kotor</th></tr></thead><tbody>${dep.map(o => `<tr class="click" onclick="A.openInv('${o.i.id}')"><td>${fdate(o.i.tglBerangkat)}</td><td><b>${esc(o.i.program || '-')}</b><div class="small muted">${esc(o.i.customerNama)} · ${num(o.i.pax)} pax</div></td><td class="num">${rp(o.x.gp)}<div class="small muted">${pct(o.x.margin)}</div></td></tr>`).join('')}</tbody></table></div>` : '<div class="empty">Belum ada keberangkatan terjadwal.</div>'}
    </div>
  </div>`;
}

/* ---- Invoices ---- */
function vInvoices(){
  const q = UI.invQ.toLowerCase();
  let rows = S.invoices.map(i => ({ i, x: invInfo(i) }))
    .filter(o => !UI.invM || ym(o.i.tgl) === UI.invM)
    .filter(o => !q || [o.i.no, o.i.customerNama, o.i.program, o.i.destinasi].join(' ').toLowerCase().includes(q))
    .filter(o => UI.invSt === 'arsip' ? o.x.arsip : !o.x.arsip)
    .filter(o => !UI.invSt || UI.invSt === 'arsip' || (UI.invSt === 'overdue' ? o.x.overdue : o.x.st === UI.invSt))
    .filter(o => !UI.invCur || o.x.cur === UI.invCur)
    .sort((a,b) => (b.i.tgl||'').localeCompare(a.i.tgl||'') || (b.i.no||'').localeCompare(a.i.no||''));
  return pageHead('Invoice & Pembayaran', 'Buat invoice, catat deposit / pelunasan / refund, dan cetak kuitansi.', `<button class="btn pri" onclick="A.invForm()">+ Invoice baru</button>`) + `
  <div class="card">
    <div class="hd"><div class="toolbar">
      <input id="invQ" placeholder="Cari no, customer, program…" value="${esc(UI.invQ)}" oninput="A.set('invQ',this.value)">
      <select id="invSt" onchange="A.set('invSt',this.value)">${[['','Semua status'],['belum','Belum dibayar'],['sebagian','Dibayar sebagian'],['lunas','Lunas'],['overdue','Jatuh tempo'],['batal','Batal'],['arsip','Arsip Odoo (data saja)']].map(([v,l]) => `<option value="${v}" ${UI.invSt===v?'selected':''}>${l}</option>`).join('')}</select>
      <select id="invCur" onchange="A.set('invCur',this.value)">${opt([['','IDR & USD'],['IDR','IDR'],['USD','USD']], UI.invCur)}</select>
      <input type="month" id="invM" value="${UI.invM}" onchange="A.set('invM',this.value)" title="Periode tanggal invoice">
      ${UI.invM ? `<button class="btn sm ghost" onclick="A.set('invM','')">Semua periode</button>` : ''}
    </div><div class="btns"><span class="small muted">${rows.length} invoice</span><label class="btn sm">Impor Odoo (xlsx/csv)<input type="file" accept=".xlsx,.xls,.csv" multiple class="hide" onchange="A.odooFile(this)"></label>${UI.invSt === 'arsip' && rows.length ? '<button class="btn sm" style="color:var(--red)" onclick="A.delArsip()">Hapus semua arsip</button>' : ''}</div></div>
    ${UI.invSt === 'arsip' ? '<div class="note" style="margin:12px 16px">Arsip Odoo hanya disimpan sebagai data. Tidak dihitung di piutang, laporan, maupun pajak. Buka satu invoice lalu klik "Jadikan invoice aktif" jika ingin mencatat pembayarannya di aplikasi ini.</div>' : ''}
    ${rows.length ? `<div class="tbl-wrap"><table class="t"><thead><tr><th>No. Invoice</th><th>Tanggal</th><th>Customer / Program</th><th>Status</th><th class="num">Total</th><th class="num">Dibayar</th><th class="num">Sisa</th></tr></thead><tbody>
    ${rows.map(o => `<tr class="click" onclick="A.openInv('${o.i.id}')"><td><b>${esc(o.i.no)}</b></td><td>${fdate(o.i.tgl)}<div class="small muted">JT ${fdate(o.i.jatuhTempo)}</div></td><td><b>${esc(o.i.customerNama)}</b><div class="small muted">${esc(o.i.program||'')}${o.i.tglBerangkat ? ' · ' + fdate(o.i.tglBerangkat) : ''}</div></td><td>${statusBadge(o.x)}</td><td class="num">${money(o.x.total, o.x.cur)}</td><td class="num">${money(o.x.net, o.x.cur)}</td><td class="num b">${money(o.x.sisa, o.x.cur)}</td></tr>`).join('')}
    </tbody><tfoot>${['IDR','USD'].filter(cu => rows.some(o => o.x.cur === cu)).map(cu => { const rr = rows.filter(o => o.x.cur === cu); return `<tr><td colspan="4">Total ${cu}</td><td class="num">${money(sum(rr, o => o.x.total), cu)}</td><td class="num">${money(sum(rr, o => o.x.net), cu)}</td><td class="num">${money(sum(rr, o => o.x.sisa), cu)}</td></tr>`; }).join('')}</tfoot></table></div>` : `<div class="empty">Belum ada invoice${S.customers.length ? '' : '. Tambahkan customer lebih dulu'}.</div>`}

  </tbody></table></div>` : '<div class="empty">Belum ada customer.</div>'}</div>`;
}

/* ---- Income ---- */
function vIncome(){
  const m = UI.incM;
  const pays = S.payments.filter(p => !m || ym(p.tgl) === m).map(p => ({ t: p.tipe, tgl: p.tgl, ref: p.no, ket: `${(invById(p.invoiceId)||{}).no || p.invoiceNo || ''} · ${custName(p.customerId)}${curOf(invById(p.invoiceId)) === 'USD' ? ` · ${money(p.jumlah, 'USD')}` : ''}`, metode: akunName(akunOf(p)), pribadi: (akunList().find(a => a.id === akunOf(p)) || {}).jenis === 'pribadi', jml: p.tipe === 'refund' ? -payIdr(p) : payIdr(p), pph: p.tipe === 'refund' ? 0 : num(p.pph), id: p.id, kind: 'pay' }));
  const inc = S.incomes.filter(x => !m || ym(x.tgl) === m).map(x => ({ t: 'lain', tgl: x.tgl, ref: x.kategori, ket: x.keterangan, metode: akunName(akunOf(x)), jml: num(x.jumlah), pph: 0, id: x.id, kind: 'inc', omzet: x.omzet }));
  const rows = [...pays, ...inc].sort((a,b) => (b.tgl||'').localeCompare(a.tgl||''));
  const dep = sum(pays.filter(p => p.t === 'deposit'), p => p.jml), pel = sum(pays.filter(p => p.t === 'pelunasan'), p => p.jml), ref = sum(pays.filter(p => p.t === 'refund'), p => p.jml), lain = sum(inc, x => x.jml);
  return pageHead('Pemasukan', 'Deposit & pelunasan dicatat dari invoice. Pemasukan lain (komisi vendor, bunga, dll.) dicatat di sini.', `<button class="btn pri" onclick="A.incForm()">+ Pemasukan lain</button>`) + `
  <div class="grid g4" style="margin-bottom:14px">
    <div class="card kpi accent"><div class="l">Deposit</div><div class="v">${rp(dep)}</div></div>
    <div class="card kpi ok"><div class="l">Pelunasan</div><div class="v">${rp(pel)}</div></div>
    <div class="card kpi red"><div class="l">Refund</div><div class="v">${rp(ref)}</div></div>
    <div class="card kpi warn"><div class="l">Pemasukan lain</div><div class="v">${rp(lain)}</div></div>
  </div>
  <div class="card"><div class="hd"><div class="toolbar"><input type="month" id="incM" value="${m}" onchange="A.set('incM',this.value)">${m ? `<button class="btn sm ghost" onclick="A.set('incM','')">Semua periode</button>` : ''}</div><div class="b">Kas masuk bersih: ${rp(dep + pel + ref + lain)}</div></div>
  ${rows.length ? `<div class="tbl-wrap"><table class="t"><thead><tr><th>Tanggal</th><th>Jenis</th><th>No. / Kategori</th><th>Keterangan</th><th>Diterima di</th><th class="num">PPh dipotong</th><th class="num">Jumlah (IDR)</th><th></th></tr></thead><tbody>
  ${rows.map(r => `<tr><td>${fdate(r.tgl)}</td><td>${tipeBadge(r.t)}</td><td class="small b">${esc(r.ref)}</td><td>${esc(r.ket)}${r.kind === 'inc' && !r.omzet ? ' <span class="small muted">(bukan omzet PP55)</span>' : ''}</td><td class="small">${esc(r.metode||'')}${r.pribadi ? ' <span class="badge b-sebagian">non-PT</span>' : ''}</td><td class="num">${r.pph ? rp(r.pph) : '-'}</td><td class="num b" style="color:${r.jml < 0 ? 'var(--red)' : 'inherit'}">${rp(r.jml)}</td><td class="num">${r.kind === 'pay' ? `<button class="btn sm" onclick="A.printRcpt('${r.id}')">Cetak</button>` : `<button class="btn sm" onclick="A.incForm('${r.id}')">Edit</button>`}</td></tr>`).join('')}
  </tbody></table></div>` : '<div class="empty">Tidak ada pemasukan pada periode ini.</div>'}</div>`;

/* ---- Expenses ---- */
function vExpenses(){
  const q = UI.expQ.toLowerCase();
  const rows = S.expenses
    .filter(e => !UI.expM || ym(e.tgl) === UI.expM)
    .filter(e => !UI.expInv || (UI.expInv === '_ops' ? !e.invoiceId : e.invoiceId === UI.expInv))
    .filter(e => !q || [e.kategori, e.vendor, e.keterangan].join(' ').toLowerCase().includes(q))
    .sort((a,b) => (b.tgl||'').localeCompare(a.tgl||''));
  const byCat = {}; rows.forEach(e => byCat[e.kategori] = (byCat[e.kategori] || 0) + num(e.jumlah));
  const top = Object.entries(byCat).sort((a,b) => b[1] - a[1]);
  const tot = sum(rows, e => e.jumlah);
  return pageHead('Pengeluaran', 'Setiap biaya trip ditautkan ke invoice (akun analitik) agar laba per invoice terlihat. Biaya kantor dicatat sebagai overhead.', `<button class="btn pri" onclick="A.expForm()">+ Pengeluaran</button>`) + `
  <div class="card"><div class="hd"><div class="toolbar">
    <input type="month" id="expM" value="${UI.expM}" onchange="A.set('expM',this.value)">
    ${UI.expM ? `<button class="btn sm ghost" onclick="A.set('expM','')">Semua periode</button>` : ''}
    <select id="expInv" onchange="A.set('expInv',this.value)"><option value="">Semua analitik</option><option value="_ops" ${UI.expInv==='_ops'?'selected':''}>Overhead / umum</option>${S.invoices.slice().sort((a,b) => (b.tgl||'').localeCompare(a.tgl||'')).map(i => `<option value="${i.id}" ${UI.expInv===i.id?'selected':''}>${esc(i.no)} — ${esc(i.program||i.customerNama)}</option>`).join('')}</select>
    <input id="expQ" placeholder="Cari vendor / keterangan…" value="${esc(UI.expQ)}" oninput="A.set('expQ',this.value)">
  </div><div class="b">Total: ${rp(tot)}</div></div>

/* ---- Kas & Bank ---- */
function vCash(){
  const L = akunList();
  const sel = UI.kasAkun && L.some(a => a.id === UI.kasAkun) ? UI.kasAkun : L[0]?.id;
  const m = UI.kasM;
  const moves = akunMoves(sel);
  let run = num((L.find(a => a.id === sel) || {}).saldoAwal);
  const withBal = moves.map(x => { run += x.jml; return { ...x, bal: run }; });
  const shown = withBal.filter(x => !m || ym(x.tgl) === m).reverse();
  const opening = m ? akunSaldo(sel, addDays(m + '-01', -1)) : num((L.find(a => a.id === sel) || {}).saldoAwal);
  const jl = { deposit:'Deposit', pelunasan:'Pelunasan', refund:'Refund', lain:'Pemasukan lain', biaya:'Pengeluaran', pajak:'Setor pajak', mutasi:'Mutasi' };
  const bc = { deposit:'b-deposit', pelunasan:'b-pelunasan', refund:'b-refund', lain:'b-lain', biaya:'b-refund', pajak:'b-refund', mutasi:'b-belum' };
  return pageHead('Kas & Bank', 'Saldo per akun. Uang customer yang masuk ke rekening non-perusahaan tetap tercatat sebagai pendapatan PT, lalu dipindah dengan Mutasi.', `<button class="btn pri" onclick="A.trfForm()">+ Mutasi antar akun</button>`) + `
  <div class="grid g3" style="margin-bottom:14px">${L.map(a => { const sa = akunSaldo(a.id); return `<div class="card kpi ${a.jenis === 'pribadi' ? 'warn' : 'accent'}" style="cursor:pointer;${a.id === sel ? 'outline:2px solid var(--teal)' : ''}" onclick="A.set('kasAkun','${a.id}')"><div class="l">${esc(a.nama)}</div><div class="v">${rp(sa)}</div><div class="s">${a.jenis === 'pribadi' ? (Math.abs(sa) >= 1 ? (sa > 0 ? 'Dana PT yang masih di rekening pribadi' : 'PT berutang ke pemilik rekening (talangan)') : 'Bersih, tidak ada dana tertahan') : 'Akun perusahaan'}</div></div>`; }).join('')}</div>
  <div class="card"><div class="hd"><div class="toolbar"><b>${esc(akunName(sel))}</b><input type="month" id="kasM" value="${m}" onchange="A.set('kasM',this.value)">${m ? `<button class="btn sm ghost" onclick="A.set('kasM','')">Semua periode</button>` : ''}</div><div class="small">Saldo awal periode <b>${rp(opening)}</b> · akhir <b>${rp(shown.length ? shown[0].bal : opening)}</b></div></div>
  ${shown.length ? `<div class="tbl-wrap"><table class="t"><thead><tr><th>Tanggal</th><th>Jenis</th><th>Ref</th><th>Keterangan</th><th class="num">Masuk</th><th class="num">Keluar</th><th class="num">Saldo</th><th></th></tr></thead><tbody>
  ${shown.map(x => `<tr><td>${fdate(x.tgl)}</td><td><span class="badge ${bc[x.jenis]}">${jl[x.jenis]}</span></td><td class="small b">${esc(x.ref)}</td><td class="small">${esc(x.ket)}</td><td class="num">${x.jml > 0 ? rpn(x.jml) : ''}</td><td class="num">${x.jml < 0 ? rpn(-x.jml) : ''}</td><td class="num b">${rpn(x.bal)}</td><td class="num">${x.tid ? `<button class="btn sm" onclick="A.trfForm('${x.tid}')">Edit</button>` : ''}</td></tr>`).join('')}
  </tbody></table></div>` : '<div class="empty">Tidak ada transaksi.</div>'}</div>
  <div class="note" style="margin-top:14px"><b>Kalau customer transfer ke rekening selain rekening PT:</b>
    <ul><li>Catat pembayarannya seperti biasa dari invoice, lalu pilih <b>Diterima di</b> = rekening pribadi / akun lain. Kuitansi tetap terbit atas nama PT, dan omzet tetap dihitung untuk PPh final.</li>
    <li>Saat dana dipindahkan ke rekening PT, catat <b>Mutasi</b> dari akun pribadi ke Bank Mandiri PT. Saldo akun pribadi kembali nol.</li>
    <li>Jika dana dipakai langsung membayar vendor, catat Pengeluaran dengan <b>Dibayar dari</b> = akun pribadi itu.</li>
    <li>Saldo positif di akun pribadi berarti dana PT masih dipegang pribadi. Saldo negatif berarti pribadi menalangi biaya PT, sehingga PT berutang ke pemilik rekening. Simpan bukti transfer untuk audit atau pemeriksaan pajak.</li></ul></div>`;
}

/* ---- Analytics ---- */
function vAnalytics(){
  const y = UI.anaY, q = UI.anaQ.toLowerCase();
  const rows = activeInv().filter(i => (i.tglBerangkat || i.tgl || '').startsWith(y) || (i.tgl||'').startsWith(y))
    .filter(i => !q || [i.no, i.customerNama, i.program, i.destinasi].join(' ').toLowerCase().includes(q))

  const R = sum(rows, o => o.x.revenue), C = sum(rows, o => o.x.cost), G = R - C;

    <div class="card kpi accent"><div class="l">Pendapatan trip</div><div class="v">${rp(R)}</div></div>
    <div class="card kpi red"><div class="l">Biaya trip (analitik)</div><div class="v">${rp(C)}</div></div>
    <div class="card kpi ok"><div class="l">Laba kotor</div><div class="v">${rp(G)}</div><div class="s">Margin ${pct(R ? G/R*100 : 0)}</div></div>
    <div class="card kpi warn"><div class="l">Overhead ${y}</div><div class="v">${rp(ops)}</div><div class="s">Laba setelah overhead ${rp(G - ops)}</div></div>

  </tbody><tfoot><tr><td colspan="4">Total</td><td class="num">${rp(R)}</td><td class="num">${rp(C)}</td><td class="num">${rp(G)}</td><td class="num">${pct(R ? G/R*100 : 0)}</td></tr></tfoot></table></div>` : '<div class="empty">Belum ada invoice di tahun ini.</div>'}</div>`;

/* ---------- modal ---------- */
function modal(title, body, foot = '', opts = {}){
  const layer = opts.layer || 1;
  closeModal(layer);
  const w = document.createElement('div');
  w.className = 'mwrap' + (layer === 2 ? ' l2' : '');
  w.dataset.layer = layer;
  w.innerHTML = `<div class="modal ${opts.wide ? 'wide' : ''}"><div class="mh"><h2>${title}</h2><button class="x" onclick="A.close(${layer})">×</button></div><div class="mb">${body}</div>${foot ? `<div class="mf">${foot}</div>` : ''}</div>`;
  w.addEventListener('mousedown', e => { if (e.target === w) closeModal(layer); });
  $('#modals').appendChild(w);
  const f = w.querySelector('input:not([type=hidden]):not([readonly]),select,textarea'); if (f && !opts.nofocus) setTimeout(() => f.focus(), 30);
}
function closeModal(layer){ $$('#modals .mwrap').forEach(m => { if (!layer || +m.dataset.layer >= layer) m.remove(); }); }
const v = id => { const el = document.getElementById(id); return el ? el.value.trim() : ''; };
const opt = (arr, sel) => arr.map(x => { const [val, lab] = Array.isArray(x) ? x : [x, x]; return `<option value="${esc(val)}" ${String(val) === String(sel ?? '') ? 'selected' : ''}>${esc(lab)}</option>`; }).join('');

function saveInv(id){
  const items = readItems().filter(it => it.desc || it.harga);
  const cid = v('f_cust');
  if (!cid) return toast('Pilih customer', 'err');
  if (!items.length) return toast('Isi minimal satu baris tagihan', 'err');
  const old = id ? invById(id) : null;
  const tgl = v('f_tgl') || today();
  const no = v('f_no') || (old && old.no) || nextNo('INV', tgl);
  if (S.invoices.some(x => x.no === no && x.id !== id)) return toast('Nomor invoice sudah dipakai', 'err');
  const currency = v('f_cur') || 'IDR', kurs = currency === 'USD' ? num(v('f_kurs')) : 1;
  if (old && curOf(old) !== currency && S.payments.some(p => p.invoiceId === id)) return toast('Mata uang tidak bisa diubah karena sudah ada pembayaran', 'err');
  if (currency === 'USD' && kurs <= 0) return toast('Isi kurs Rp per USD', 'err');
  if (currency === 'USD' && kurs !== num(S.settings.lastKurs)) { S.settings.lastKurs = kurs; }
  const inv = { ...(old || {}), currency, kurs, lang: v('f_lang') || 'id', id: id || uid(), no, tgl, jatuhTempo: v('f_jt'), customerId: cid, customerNama: custName(cid),
    program: v('f_prog'), destinasi: v('f_dest'), tglBerangkat: v('f_dep'), tglPulang: v('f_ret'), pax: num(v('f_pax')), po: v('f_po'),
    items, diskon: num(v('f_disk')), ppnOn: $('#f_ppn').checked, ppnRate: num(S.settings.ppnRate), catatan: v('f_cat'),
    status: old?.status || 'aktif', createdAt: old?.createdAt || new Date().toISOString(), updatedAt: new Date().toISOString() };
  const c = invCalc(inv); Object.assign(inv, { subtotal: c.sub, dpp: c.dpp, ppn: c.ppn, total: c.total });
  save('invoices', inv); closeModal(); toast(`Invoice ${no} disimpan`);
  setTimeout(() => openInv(inv.id), 80);
}

function delInv(id){

/* ---------- payment form ---------- */
function payForm(invId, tipe, payId){
  const inv = invById(invId); const x = invInfo(inv); const cur = x.cur, usd = cur === 'USD';
  const p = payId ? S.payments.find(z => z.id === payId) : { tipe, tgl: today(), metode: 'Transfer Bank Mandiri', akun: akunDef() };
  tipe = p.tipe;
  const r2 = n => usd ? Math.round(num(n) * 100) / 100 : Math.round(num(n));
  const def = r2(payId ? p.jumlah : tipe === 'deposit' ? Math.min(x.sisa, x.total * 0.5) : tipe === 'pelunasan' ? x.sisa : x.st === 'batal' ? x.lebih : Math.min(x.net, x.lebih || x.net));
  const defIdr = payId ? payIdr(p) : Math.round(def * x.kurs);
  const ttl = { deposit: 'Terima deposit', pelunasan: 'Terima pelunasan', refund: 'Refund ke customer' }[tipe];
  const isRef = tipe === 'refund';
  modal(`${ttl} · ${esc(inv.no)}`, `
    <div class="note" style="margin-bottom:14px">Total ${money(x.total, cur)} · diterima ${money(x.net, cur)} · sisa <b>${money(x.sisa, cur)}</b>${x.lebih ? ` · kelebihan / dana tertahan <b>${money(x.lebih, cur)}</b>` : ''}</div>
    <div class="fr"><div class="fg"><label class="f">Jenis</label><select id="p_tipe">${opt([['deposit','Deposit (DP)'],['pelunasan','Pelunasan'],['refund','Refund']], tipe)}</select></div><div class="fg"><label class="f">Tanggal</label><input id="p_tgl" type="date" value="${p.tgl}"></div></div>
    <div class="fr">
      <div class="fg"><label class="f">${isRef ? `Jumlah dikembalikan (${cur})` : usd ? 'Jumlah dibayar (USD)' : 'Jumlah diterima (Rp)'}</label><input id="p_jml" type="number" step="${usd ? '0.01' : 'any'}" value="${def}" ${usd ? 'oninput="A.payIdrCalc()"' : ''}></div>
      ${usd ? `<div class="fg"><label class="f">${isRef ? 'Rupiah keluar (Rp)' : 'Rupiah masuk ke rekening (Rp)'}</label><input id="p_idr" type="number" value="${defIdr}"><div class="hint">Nilai riil di mutasi bank. Default = USD × kurs invoice ${rpn(x.kurs)}.</div></div>` : '<div></div>'}
    </div>
    ${!isRef ? `<div class="fr"><div class="fg"><label class="f">PPh final 0,5% dipotong customer (Rp)</label><input id="p_pph" type="number" value="${esc(p.pph || '')}" placeholder="0"><div class="hint">${usd ? 'Dalam Rupiah. Untuk invoice USD, isi jumlah USD sebesar bagian tagihan yang dilunasi termasuk bagian yang dipotong.' : 'Isi jika customer memotong PPh &amp; menerbitkan bukti potong.'}</div></div><div class="fg"><label class="f">No. bukti potong (jika ada)</label><input id="p_bupot" value="${esc(p.bupot)}"></div></div>` : ''}
    <div class="fr">
      <div class="fg"><label class="f">${isRef ? 'Dibayar dari akun' : 'Diterima di akun'}</label><select id="p_akun" onchange="A.akunHint('p_akun','p_akunHint')">${opt(akunList().map(a => [a.id, a.nama + (a.jenis === 'pribadi' ? ' (non-PT)' : '')]), akunOf(p))}</select><div class="hint" id="p_akunHint"></div></div>
      <div class="fg"><label class="f">Metode</label><select id="p_met">${opt(METODE, p.metode)}</select></div>
    </div>
    <div class="fg"><label class="f">No. referensi transfer</label><input id="p_ref" value="${esc(p.ref)}"></div>
    <div class="fg"><label class="f">${isRef ? 'Alasan refund / rekening tujuan' : 'Catatan'}</label><textarea id="p_cat" rows="2">${esc(p.catatan)}</textarea></div>`,
    `${payId ? `<button class="btn" style="margin-right:auto;color:var(--red)" onclick="A.delPay('${payId}')">Hapus</button>` : ''}<button class="btn" onclick="A.openInv('${invId}')">Kembali</button><button class="btn pri" onclick="A.savePay('${invId}',${payId ? `'${payId}'` : 'null'},true)">Simpan & cetak</button><button class="btn pri" onclick="A.savePay('${invId}',${payId ? `'${payId}'` : 'null'})">Simpan</button>`);
  akunHint('p_akun', 'p_akunHint');
  A._payKurs = x.kurs;
}
function akunHint(sel, hint){
  const a = akunList().find(z => z.id === v(sel)); const h = document.getElementById(hint); if (!h) return;
  h.innerHTML = a && a.jenis === 'pribadi' ? '<span style="color:var(--warn)">Rekening non-PT: tetap dicatat sebagai pendapatan/biaya PT. Setelah dana dipindah, catat Mutasi di menu Kas &amp; Bank.</span>' : '';
}
function payIdrCalc(){ const el = $('#p_idr'); if (el) el.value = Math.round(num(v('p_jml')) * num(A._payKurs)); }
function savePay(invId, payId, andPrint){
  const inv = invById(invId); const cur = curOf(inv);
  const old = payId ? S.payments.find(z => z.id === payId) : null;
  const tipe = v('p_tipe'), tgl = v('p_tgl') || today(), jumlah = num(v('p_jml'));
  if (jumlah <= 0) return toast('Jumlah harus lebih dari 0', 'err');
  const idr = cur === 'USD' ? num(v('p_idr')) : jumlah;
  if (cur === 'USD' && idr <= 0) return toast('Isi nilai Rupiah yang diterima/dibayar', 'err');
  const kind = tipe === 'refund' ? 'RF' : 'KW';
  let no = old?.no;
  if (!no || (old.tipe === 'refund') !== (tipe === 'refund')) no = nextNo(kind, tgl);
  const p = { ...(old || {}), id: payId || uid(), no, invoiceId: invId, invoiceNo: inv.no, customerId: inv.customerId, tipe, tgl, jumlah, currency: cur, idr,
    pph: tipe === 'refund' ? 0 : num(v('p_pph')), bupot: tipe === 'refund' ? '' : v('p_bupot'), akun: v('p_akun') || akunDef(), metode: v('p_met'), ref: v('p_ref'), catatan: v('p_cat'),
    createdAt: old?.createdAt || new Date().toISOString() };
  save('payments', p); toast(`${no} tersimpan`);
  setTimeout(() => { openInv(invId); if (andPrint) printRcpt(p.id); }, 80);
}
function delPay(id){
  const p = S.payments.find(z => z.id === id);
  if (!confirm(`Hapus ${p.no}?`)) return;
  remove('payments', id); toast('Pembayaran dihapus'); setTimeout(() => openInv(p.invoiceId), 80);
}

async function loadXLSX(){
  if (window.XLSX) return;
  await new Promise((res, rej) => { const sc = document.createElement('script'); sc.src = 'https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js'; sc.onload = res; sc.onerror = () => rej(new Error('pustaka Excel gagal dimuat (cek internet)')); document.head.appendChild(sc); });
}
function parseCsv(text){
  text = text.replace(/^﻿/, '');
  const first = text.split('\n')[0]; const d = (first.match(/;/g) || []).length > (first.match(/,/g) || []).length ? ';' : ',';
  const out = []; let row = [], f = '', q = false;
  for (let i = 0; i < text.length; i++){
    const ch = text[i];
    if (q){ if (ch === '"'){ if (text[i+1] === '"'){ f += '"'; i++; } else q = false; } else f += ch; }
    else if (ch === '"') q = true;
    else if (ch === d){ row.push(f); f = ''; }
    else if (ch === '\n' || ch === '\r'){ if (ch === '\r' && text[i+1] === '\n') i++; row.push(f); out.push(row); row = []; f = ''; }
    else f += ch;
  }
  if (f || row.length){ row.push(f); out.push(row); }
  const h = out.shift() || [];
  return out.filter(r => r.some(x => x !== '')).map(r => Object.fromEntries(h.map((k, i) => [k.trim(), r[i] ?? ''])));
}
function toISODate(v){
  if (v == null || v === '') return '';
  if (typeof v === 'number') return new Date(Date.UTC(1899, 11, 30) + Math.round(v * 864e5)).toISOString().slice(0,10);
  if (v instanceof Date) return `${v.getFullYear()}-${String(v.getMonth()+1).padStart(2,'0')}-${String(v.getDate()).padStart(2,'0')}`;
  const sv = String(v).trim();
  let m = sv.match(/^(\d{4})-(\d{2})-(\d{2})/); if (m) return `${m[1]}-${m[2]}-${m[3]}`;
  m = sv.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{4})/); if (m) return `${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;
  return '';
}
const numAny = v => typeof v === 'number' ? v : num(String(v).replace(/[^\d.,-]/g, '').replace(/\.(?=\d{3}(\D|$))/g, '').replace(',', '.'));
let ODOO = null;
async function odooFile(inp){
  const files = [...inp.files]; inp.value = ''; if (!files.length) return;
  try {
    const rows = [];
    for (const f of files){
      if (/\.csv$/i.test(f.name)) rows.push(...parseCsv(await f.text()));
      else { await loadXLSX(); const wb = XLSX.read(await f.arrayBuffer(), { type: 'array' }); rows.push(...XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { raw: true, defval: '' })); }
    }
    if (!rows.length) throw new Error('file kosong');
    const keys = Object.keys(rows[0]);
    const pick = re => keys.find(k => re.test(k));
    const K = { no: pick(/^(number|nomor|no\.?)$/i) || pick(/number/i), partner: pick(/partner/i) || pick(/customer|pelanggan/i), date: pick(/invoice.*date|bill date|tanggal/i), due: pick(/due/i), untaxed: pick(/untaxed/i), total: pick(/^total/i) || pick(/total/i), status: pick(/status|state/i), cur: pick(/^currency$|mata uang/i) };
    if (!K.no || !K.partner || !(K.total || K.untaxed)) throw new Error('kolom Number / Partner / Total tidak ditemukan');
    ODOO = rows.map(r => ({ no: String(r[K.no] ?? '').trim(), partner: String(r[K.partner] ?? '').trim(), tgl: toISODate(r[K.date]), due: toISODate(r[K.due]), untaxed: numAny(r[K.untaxed] ?? r[K.total]), total: numAny(r[K.total] ?? r[K.untaxed]), status: String(r[K.status] ?? '').trim(), cur: K.cur ? String(r[K.cur]).toUpperCase().trim() : '' }));

}

    if (!c){ c = { id: uid(), nama: r.partner.trim(), jenis: 'Travel Agent', sumber: 'Odoo', createdAt: now }; custMap.set(key, c); newCust.push(c); }
    const cur = r.cur === 'USD' || r.cur === 'IDR' ? r.cur : (Math.abs(r.total) < th ? 'USD' : 'IDR');
    invs.push({ id: 'odoo-' + r.no.replace(/[^A-Za-z0-9]+/g, '-'), no: r.no, tgl: r.tgl, jatuhTempo: r.due || r.tgl, customerId: c.id, customerNama: c.nama,
      program: '', destinasi: '', items: [{ desc: 'Data impor Odoo', qty: 1, satuan: '', harga: r.total }], diskon: 0, ppnOn: false, ppnRate: num(S.settings.ppnRate),
      currency: cur, kurs: cur === 'USD' ? kursArsip : 1, lang: S.settings.docLang || 'id', status: 'aktif', arsip: true, odooStatus: r.status, odooUntaxed: r.untaxed, sumber: 'odoo',
      subtotal: r.total, dpp: r.total, ppn: 0, total: r.total, createdAt: now });
  });
  try {
    if (newCust.length) await DB.putMany('customers', newCust);
    await DB.putMany('invoices', invs);
    closeModal(); UI.invSt = 'arsip'; render();
    toast(`${invs.length} invoice arsip & ${newCust.length} customer diimpor`);
  } catch (e) { btn.disabled = false; btn.textContent = 'Coba lagi'; toast('Gagal impor: ' + e.message, 'err'); }
}
async function delArsip(){
  const ids = S.invoices.filter(i => i.arsip && !S.payments.some(p => p.invoiceId === i.id) && !S.expenses.some(e => e.invoiceId === i.id)).map(i => i.id);
  if (!ids.length) return toast('Tidak ada arsip yang bisa dihapus');
  if (!confirm(`Hapus ${ids.length} invoice arsip Odoo? Customer tidak ikut terhapus.`)) return;
  try { await DB.delMany('invoices', ids); toast(`${ids.length} arsip dihapus`); } catch (e) { toast(e.message, 'err'); }
}

/* ---------- CSV / backup ---------- */
function dl(name, text, type = 'text/csv'){
  const b = new Blob([type === 'text/csv' ? '﻿' + text : text], { type: type + ';charset=utf-8' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
const csvRow = arr => arr.map(x => { const s = String(x ?? ''); return /[",;\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; }).join(';');
function csv(col){
  const M = {
    invoices: [['No','Tanggal','Jatuh tempo','Customer','Program','Destinasi','Berangkat','Pulang','Pax','Mata uang','Kurs','Subtotal','Diskon','DPP','PPN','Total','Diterima','Sisa','Total IDR','Status','Arsip Odoo','Status Odoo','Bahasa'], i => { const x = invInfo(i); return [i.no, i.tgl, i.jatuhTempo, i.customerNama, i.program, i.destinasi, i.tglBerangkat, i.tglPulang, i.pax, x.cur, x.kurs, x.sub, i.diskon || 0, x.dpp, x.ppn, x.total, x.net, x.sisa, Math.round(x.totalIdr), x.st, i.arsip ? 'Ya' : '', i.odooStatus || '', i.lang || 'id']; }],
    payments: [['No','Tanggal','Jenis','Invoice','Customer','Mata uang','Jumlah','Rupiah (IDR)','PPh dipotong','No bupot','Diterima di / dibayar dari','Metode','Ref','Catatan'], p => [p.no, p.tgl, p.tipe, (invById(p.invoiceId)||{}).no, custName(p.customerId), curOf(invById(p.invoiceId)), p.jumlah, payIdr(p), p.pph || 0, p.bupot, akunName(akunOf(p)), p.metode, p.ref, p.catatan]],
    expenses: [['Tanggal','Invoice','Kategori','Vendor','Keterangan','Mata uang','Nominal valas','Kurs','Jumlah IDR','Dibayar dari','Metode','Bukti'], e => [e.tgl, (invById(e.invoiceId)||{}).no || 'OVERHEAD', e.kategori, e.vendor, e.keterangan, e.mataUang, e.nominalAsing, e.kurs, e.jumlah, akunName(akunOf(e)), e.metode, e.buktiUrl]],
    incomes: [['Tanggal','Kategori','Keterangan','Jumlah','Akun','Metode','Omzet PP55'], x => [x.tgl, x.kategori, x.keterangan, x.jumlah, akunName(akunOf(x)), x.metode, x.omzet ? 'Ya' : 'Tidak']],
    transfers: [['Tanggal','Dari akun','Ke akun','Jumlah','Keterangan'], t => [t.tgl, akunName(t.dari), akunName(t.ke), t.jumlah, t.ket]],
    customers: [['Nama','Jenis','PIC','Telp','Email','Kota','Alamat','NPWP'], c => [c.nama, c.jenis, c.pic, c.telp, c.email, c.kota, c.alamat, c.npwp]],
  }[col];
  const rows = S[col].slice().sort((a,b) => (a.tgl||a.nama||'').localeCompare(b.tgl||b.nama||''));
  dl(`${col}-${today()}.csv`, [csvRow(M[0]), ...rows.map(r => csvRow(M[1](r)))].join('\n'));
}
async function exportOdoo(){
  const stMap = { lunas: 'Paid', sebagian: 'Partially Paid', belum: 'Not Paid', batal: 'Cancelled' };
  const H = ['Number','Invoice Partner Display Name','Invoice/Bill Date','Due Date','Untaxed Amount Signed Currency','Total in Currency Signed','Status In Payment','Currency'];
  const rows = S.invoices.slice().sort((a,b) => (b.tgl||'').localeCompare(a.tgl||'') || (b.no||'').localeCompare(a.no||'')).map(i => { const x = invInfo(i); return [i.no, i.customerNama, i.tgl, i.jatuhTempo, x.dpp, x.total, i.arsip ? (i.odooStatus || '') : stMap[x.st], x.cur]; });
  try {
    await loadXLSX();
    const serial = d => { const [y, m, dd] = d.split('-').map(Number); return (Date.UTC(y, m - 1, dd) - Date.UTC(1899, 11, 30)) / 864e5; };
    const data = [H, ...rows.map(r => r.map((c, k) => (k === 2 || k === 3) && c ? serial(c) : c))];
    const ws = XLSX.utils.aoa_to_sheet(data);
    rows.forEach((r, i) => [2, 3].forEach(k => { const ref = XLSX.utils.encode_cell({ r: i + 1, c: k }); if (ws[ref] && typeof ws[ref].v === 'number') ws[ref].z = 'yyyy-mm-dd'; }));
    ws['!cols'] = [18, 38, 14, 14, 18, 18, 16, 10].map(w => ({ wch: w }));
    const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, 'Sheet1');
    XLSX.writeFile(wb, `Journal_Entry_middex_${today()}.xlsx`);
  } catch (e) {
    dl(`Journal_Entry_middex_${today()}.csv`, [csvRow(H), ...rows.map(csvRow)].join('\n'));
  }
}
function csvTax(){
  const y = UI.taxY, R = taxRecap(y);
  dl(`rekap-pph-final-${y}.csv`, [csvRow(['Masa','Omzet invoice','Omzet lain','Peredaran bruto','PPh final','Dipotong customer','Setor sendiri','Sudah disetor','Batas setor','DPP PPN','PPN']), ...R.map(r => csvRow([`${y}-${String(r.m+1).padStart(2,'0')}`, Math.round(r.omzetInv), Math.round(r.omzetLain), Math.round(r.omzet), r.pph, r.wht, r.setor, r.dibayar, r.due, Math.round(r.ppnDpp), r.ppn]))].join('\n'));
}
function csvPL(){
  const y = UI.repY, P = plRecap(y);
  dl(`laba-rugi-${y}.csv`, [csvRow(['Bulan','Pendapatan','Biaya trip','Laba kotor','Pendapatan lain','Overhead','Laba sebelum pajak','PPh final','Laba bersih']), ...P.map(p => csvRow([p.m, p.pend, p.hpp, p.gp, p.lain, p.ops, p.ebt, p.pph, p.net].map(z => typeof z === 'number' ? Math.round(z) : z)))].join('\n'));
}
function csvAnalytics(){
  const rows = activeInv().filter(i => (i.tgl||'').startsWith(UI.anaY) || (i.tglBerangkat||'').startsWith(UI.anaY));
  dl(`analitik-invoice-${UI.anaY}.csv`, [csvRow(['Invoice','Customer','Program','Berangkat','Pax','Pendapatan','Biaya','Laba kotor','Margin %', ...CAT_TRIP]), ...rows.map(i => { const x = invInfo(i); return csvRow([i.no, i.customerNama, i.program, i.tglBerangkat, i.pax, Math.round(x.revenue), Math.round(x.cost), Math.round(x.gp), x.margin.toFixed(1), ...CAT_TRIP.map(c => sum(x.exps.filter(e => e.kategori === c), e => e.jumlah))]); })].join('\n'));
}
function backup(){
  const o = { app: 'middex-finance', version: 1, exportedAt: new Date().toISOString(), settings: S.settings };
  COLS.forEach(c => o[c] = S[c]);
  dl(`middex-backup-${today()}.json`, JSON.stringify(o, null, 1), 'application/json');
}
function restore(inp){
  const f = inp.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const o = JSON.parse(r.result);
      if (o.app !== 'middex-finance') throw new Error('Bukan file backup Middex Finance');
      const n = COLS.reduce((s, c) => s + (o[c] || []).length, 0);
      if (!confirm(`Impor ${n} data ke database ${DB.mode === 'firebase' ? 'Firebase' : 'lokal'}?`)) return;
      COLS.forEach(c => (o[c] || []).forEach(x => x.id && save(c, x)));
      if (o.settings) DB.saveSettings(o.settings);
      toast(`${n} data diimpor`);
    } catch (e) { toast('Gagal impor: ' + e.message, 'err'); }
    inp.value = '';
  };
  r.readAsText(f);
}

/* ---------- settings actions ---------- */
function saveSettings(){
  const o = { ...S.settings };
  Object.keys(DEFAULT_SETTINGS).forEach(k => { const el = document.getElementById('s_' + k); if (!el) return; o[k] = el.type === 'checkbox' ? el.checked : el.type === 'number' ? num(el.value) : el.value.trim(); });
  o.prefix = (o.prefix || 'MDA').toUpperCase().replace(/[^A-Z0-9]/g, '') || 'MDA';
  const ak = $$('#akunTbl .akrow').map(r => ({ id: r.dataset.id || uid(), nama: r.querySelector('.ak-nama').value.trim(), jenis: r.querySelector('.ak-jenis').value, saldoAwal: num(r.querySelector('.ak-saldo').value) })).filter(a => a.nama);
  if (ak.length) o.akun = ak;
  const p = DB.saveSettings(o); if (p && p.catch) p.catch(e => toast('Gagal: ' + e.message, 'err'));
  if (DB.mode === 'firebase') S.settings = { ...DEFAULT_SETTINGS, ...o };
  toast('Pengaturan disimpan'); scheduleRender();
}
function connectFb(src){
  try {
    const cfg = parseConfig(v(src || 'fbcfg'));
    localStorage.setItem('mdx_fbconfig', JSON.stringify(cfg));
    localStorage.removeItem('mdx_mode');
    toast('Konfigurasi disimpan, memuat ulang…');
    setTimeout(() => location.reload(), 600);
  } catch (e) { toast('Konfigurasi tidak valid: ' + e.message, 'err'); }
}
function disconnectFb(){
  if (!confirm('Putuskan Firebase di perangkat ini dan kembali ke mode lokal? Data di Firebase tidak dihapus.')) return;
  localStorage.removeItem('mdx_fbconfig'); localStorage.setItem('mdx_mode', 'local'); location.reload();
}

/* ---------- auth / boot screens ---------- */
function screenSetup(){
  $('#app').innerHTML = `<div class="auth"><div class="box wide"><img src="${LOGO}" alt="Middex"><h2>Middex Finance</h2><p class="c">Invoice, kas, analitik trip & pajak — PT Middex Dutaloka Adikarsa</p>
    <div class="fg"><label class="f">Tempel firebaseConfig (Firebase Console → Project settings → Web app)</label><textarea id="fbcfg0" rows="8" placeholder="const firebaseConfig = {&#10;  apiKey: &quot;...&quot;,&#10;  authDomain: &quot;xxx.firebaseapp.com&quot;,&#10;  projectId: &quot;xxx&quot;,&#10;  storageBucket: &quot;...&quot;,&#10;  messagingSenderId: &quot;...&quot;,&#10;  appId: &quot;...&quot;&#10;};"></textarea></div>
    <button class="btn pri" style="width:100%;justify-content:center;padding:11px" onclick="A.connectFb('fbcfg0')">Hubungkan ke Firebase</button>
    <div style="text-align:center;margin:14px 0 4px" class="small muted">atau</div>
    <button class="btn" style="width:100%;justify-content:center" onclick="A.useLocal()">Coba dulu dengan mode lokal (data di browser ini saja)</button>
    <p class="small muted" style="margin-top:14px">Panduan setup Firebase & Security Rules ada di menu Pengaturan setelah masuk.</p>
  </div></div>`;
}
function screenLogin(err){
  $('#app').innerHTML = `<div class="auth"><div class="box"><img src="${LOGO}" alt="Middex"><h2>Masuk</h2><p class="c">${esc(S.settings.nama)}</p>
    <form onsubmit="event.preventDefault();A.login()">
      <div class="fg"><label class="f">Email</label><input id="l_email" type="email" autocomplete="username" required></div>
      <div class="fg"><label class="f">Password</label><input id="l_pass" type="password" autocomplete="current-password" required></div>
      ${err ? `<div class="note red small" style="margin-bottom:12px">${esc(err)}</div>` : ''}
      <button class="btn pri" id="l_btn" style="width:100%;justify-content:center;padding:11px">Masuk</button>
    </form>
    <div class="btns" style="justify-content:space-between;margin-top:14px"><button class="btn sm ghost" onclick="A.resetPw()">Lupa password</button>${FIREBASE_CONFIG ? '' : '<button class="btn sm ghost" onclick="A.disconnectFb()">Ganti / putuskan Firebase</button>'}</div>
    <p class="small muted" style="margin-top:10px">Akun dibuat oleh admin di Firebase Console → Authentication → Users.</p>
  </div></div>`;
  setTimeout(() => $('#l_email')?.focus(), 50);
}
async function login(){
  const btn = $('#l_btn'); btn.disabled = true; btn.textContent = 'Memproses…';
  try { await fb.authM.signInWithEmailAndPassword(fb.auth, v('l_email'), $('#l_pass').value); }
  catch (e) { screenLogin(({'auth/invalid-credential':'Email atau password salah.','auth/too-many-requests':'Terlalu banyak percobaan, coba lagi nanti.','auth/network-request-failed':'Tidak ada koneksi internet.'})[e.code] || e.message); }
}
async function resetPw(){
  const em = v('l_email'); if (!em) return toast('Isi email dulu', 'err');
  try { await fb.authM.sendPasswordResetEmail(fb.auth, em); toast('Link reset password dikirim ke ' + em); } catch (e) { toast(e.message, 'err'); }
}
async function logout(){ if (!confirm('Keluar dari aplikasi?')) return; unsubs.forEach(u => u()); unsubs = []; await fb.authM.signOut(fb.auth); }
function useLocal(){ localStorage.setItem('mdx_mode', 'local'); location.reload(); }

async function boot(){
  const cfg = getFbConfig();
  const forceLocal = localStorage.getItem('mdx_mode') === 'local';
  if (cfg && !(forceLocal && !FIREBASE_CONFIG)){
    $('#app').innerHTML = `<div class="auth"><div class="box" style="text-align:center"><img src="${LOGO}" alt=""><p class="c">Menghubungkan ke Firebase…</p></div></div>`;
    try { await loadFirebase(cfg); }
    catch (e) {
      $('#app').innerHTML = `<div class="auth"><div class="box"><img src="${LOGO}" alt=""><div class="note red">Gagal memuat Firebase: ${esc(e.message)}<br>Periksa koneksi internet atau konfigurasi.</div><div class="btns" style="margin-top:12px"><button class="btn pri" onclick="location.reload()">Coba lagi</button><button class="btn" onclick="A.disconnectFb()">Pakai mode lokal</button></div></div></div>`;
      return;
    }
    fb.authM.onAuthStateChanged(fb.auth, u => {
      user = u;
      if (u){ $('#app').innerHTML = ''; subscribeFirebase(); render(); }
      else { unsubs.forEach(x => x()); unsubs = []; COLS.forEach(c => S[c] = []); screenLogin(); }
    });
  } else if (forceLocal){
    DB = LocalDB; LocalDB.load(); render();
  } else {
    screenSetup();
  }
}

};
window.addEventListener('hashchange', () => { UI.route = (location.hash || '#dashboard').slice(1); closeModal(); render(); window.scrollTo(0, 0); });
document.addEventListener('keydown', e => { if (e.key === 'Escape'){ const ms = $$('#modals .mwrap'); if (ms.length) ms[ms.length - 1].remove(); } });
boot();
